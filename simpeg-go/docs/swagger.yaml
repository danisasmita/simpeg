host: localhost:8000
info:
  contact:
    name: SIMPEG UML
  description: Backend API Sistem Informasi Manajemen Kepegawaian Universitas Muhammadiyah
    Lampung (Gin + GORM).
  termsOfService: http://simpeg.uml.ac.id
  title: SIMPEG UML API
  version: "1.0"
paths:
  /absensi/{pegawaiId}/history:
    get:
      description: Rentang default 30 hari terakhir; gunakan `from`/`to` (YYYY-MM-DD)
        untuk rentang tertentu.
      parameters:
      - description: ID pegawai
        in: path
        name: pegawaiId
        required: true
        type: integer
      - description: Tanggal awal (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: Tanggal akhir (YYYY-MM-DD)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Absensi'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Riwayat absensi pegawai
      tags:
      - Absensi
  /absensi/check-in:
    post:
      consumes:
      - application/json
      description: Mencatat kehadiran masuk pegawai. `photo` berupa data URI/base64
        untuk wajah (opsional).
      parameters:
      - description: Data absen masuk
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.CheckInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Absensi'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Absen masuk
      tags:
      - Absensi
  /absensi/check-out:
    post:
      consumes:
      - application/json
      description: Mencatat kehadiran pulang pegawai. `photo` berupa data URI/base64
        untuk wajah (opsional).
      parameters:
      - description: Data absen pulang
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.CheckOutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Absensi'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Absen pulang
      tags:
      - Absensi
  /audit-logs:
    get:
      description: 'Jejak transaksi bisnis pengguna. Filter: module, action, user_id,
        from, to (YYYY-MM-DD). Respons `{data, total, page, limit}`.'
      parameters:
      - description: Halaman (default 1)
        in: query
        name: page
        type: integer
      - description: Jumlah per halaman (default 20, maks 100)
        in: query
        name: limit
        type: integer
      - description: Filter modul (mis. PEGAWAI, CUTI)
        in: query
        name: module
        type: string
      - description: Filter aksi (mis. PEGAWAI_UPDATE, CUTI_APPROVE)
        in: query
        name: action
        type: string
      - description: Filter ID pengguna
        in: query
        name: user_id
        type: integer
      - description: Tanggal awal (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: Tanggal akhir (YYYY-MM-DD)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.AuditLog'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Daftar audit log
      tags:
      - Audit Log
  /auth/account:
    delete:
      consumes:
      - application/json
      description: Menghapus akun user yang sedang login setelah verifikasi password.
      parameters:
      - description: Konfirmasi password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.DeleteAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.MessageResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Hapus akun
      tags:
      - Auth
  /auth/confirm-password:
    post:
      consumes:
      - application/json
      description: Memvalidasi password saat ini (dipakai sebelum aksi sensitif).
      parameters:
      - description: Password saat ini
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.ConfirmPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Konfirmasi password
      tags:
      - Auth
  /auth/email/verify:
    post:
      consumes:
      - application/json
      description: Memverifikasi email menggunakan token dari verify-notification.
      parameters:
      - description: Token verifikasi
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.EmailVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.VerifiedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Verifikasi email
      tags:
      - Auth
  /auth/email/verify-notification:
    post:
      description: Membuat dan mengirim token verifikasi email untuk user yang sedang
        login.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.TokenMessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Kirim ulang link verifikasi email
      tags:
      - Auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Mengirim token reset password ke email. Tanpa SMTP (dev), token
        dikembalikan pada respons.
      parameters:
      - description: Email terdaftar
        in: body
        name: body
        required: true
        schema:
