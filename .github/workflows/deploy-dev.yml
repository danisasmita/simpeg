# =============================================================
# .github/workflows/deploy-dev.yml
# Backend Go (simpeg-go) + React SPA (simpeg-go/frontend)
# Trigger: Push ke branch "develop"
# CI: build Go + test + build SPA. CD: deploy ke dev server via SSH.
# =============================================================

name: CI/CD → Dev

on:
  push:
    branches:
      - develop

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "20"

jobs:
  # ============================================================
  # JOB 1: CI — Build + Test (Go) & frontend build check
  # ============================================================
  ci:
    name: "🔍 CI — Go build/test & SPA build"
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐹 Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: simpeg-go/go.sum

      - name: 📦 Vet
        working-directory: simpeg-go
        run: go vet ./...

      - name: 🔨 Build
        working-directory: simpeg-go
        run: go build ./...

      - name: 🧪 Test
        working-directory: simpeg-go
        run: go test ./...

      - name: 🟢 Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: simpeg-go/frontend/package-lock.json

      - name: 📦 Install npm dependencies
        working-directory: simpeg-go/frontend
        run: npm ci --legacy-peer-deps

      - name: 🔨 Build SPA (tsc + vite)
        working-directory: simpeg-go/frontend
        run: npm run build

  # ============================================================
  # JOB 2: CD — Deploy ke Dev Server (hanya jika CI pass)
  # ============================================================
  deploy-dev:
    name: "🚀 Deploy → dev.simpeg.uml.ac.id"
    runs-on: ubuntu-latest
    needs: ci
    environment:
      name: development
      url: https://dev.simpeg.uml.ac.id

    steps:
      - name: 🔑 Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_PROJECT_PATH }}
            git fetch origin
            git checkout develop
            git pull origin develop
            # docker-compose.dev-server.yml adalah compose khusus VPS dev/staging
            # (context ./simpeg-go, nginx SSL untuk dev.simpeg.uml.ac.id)
            docker compose -f docker-compose.dev-server.yml build app --no-cache
            docker compose -f docker-compose.dev-server.yml up -d \
              --force-recreate app nginx
            echo "✅ Deploy dev selesai!"