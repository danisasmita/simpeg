# =============================================================
# .github/workflows/deploy-prod.yml
# Backend Go (simpeg-go) + React SPA (simpeg-go/frontend)
# Trigger: Merge Pull Request ke branch "main"
# CI: build Go + test + build SPA. CD: deploy ke VPS via SSH.
# =============================================================

name: CI/CD → Production

on:
  push:
    branches:
      - main

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "20"

jobs:
  # ============================================================
  # JOB 1: CI — Build + Test (Go) & frontend build check
  # ============================================================
  ci:
    name: "🔍 CI — Go build/test & SPA build (Production Gate)"
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐹 Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: simpeg-go/go.sum

      - name: 📦 Vet
        working-directory: simpeg-go
        run: go vet ./...

      - name: 🔨 Build
        working-directory: simpeg-go
        run: go build ./...

      - name: 🧪 Test
        working-directory: simpeg-go
        run: go test ./...

      - name: 🟢 Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: simpeg-go/frontend/package-lock.json

      - name: 📦 Install npm dependencies
        working-directory: simpeg-go/frontend
        run: npm ci --legacy-peer-deps

      - name: 🔨 Build SPA (tsc + vite)
        working-directory: simpeg-go/frontend
        run: npm run build

  # ============================================================
  # JOB 2: CD — Deploy Production (hanya jika CI pass)
  # ============================================================
  deploy-prod:
    name: "🚀 Deploy → simpeg.uml.ac.id (PRODUCTION)"
    runs-on: ubuntu-latest
    needs: ci
    environment:
      name: production
      url: https://simpeg.uml.ac.id

    steps:
      - name: 🔑 Deploy via SSH (rolling restart)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_PROJECT_PATH }}

            echo "📥 Pull latest main..."
            git fetch origin
            git checkout main
            git pull origin main

            echo "🔨 Build production image (SPA + Go)..."
            docker compose build --no-cache app

            echo "🔄 Rolling restart (app dulu, Nginx terakhir)..."
            docker compose up -d --force-recreate app
            sleep 8
            docker compose up -d --force-recreate nginx

            echo "🏥 Health check..."
            sleep 5
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://simpeg.uml.ac.id/health)
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "❌ Health check gagal! Status: $HTTP_STATUS"
              exit 1
            fi

            echo "✅ Production deploy berhasil! Status: $HTTP_STATUS"