server {
    listen 80;
    server_name localhost;

    server_tokens off;
    client_max_body_size 15m;

    charset utf-8;

    # Foto pegawai → Backend Go (SPA + upload di-serve oleh Go)
    location ^~ /uploads/ {
        proxy_pass http://simpeg-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        access_log off;
    }

    # REST API → Backend Go
    location /api/ {
        proxy_pass http://simpeg-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }

    # Swagger/OpenAPI UI → Backend Go
    location ^~ /swagger/ {
        proxy_pass http://simpeg-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Aset SPA (cache panjang; nama file di-hash oleh Vite)
    location /assets/ {
        proxy_pass http://simpeg-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 30d;
    }

    # Index & SPA fallback → Go (client-side routing di Go)
    location / {
        proxy_pass http://simpeg-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }

    error_log  /dev/stderr notice;
    access_log /dev/stdout combined;
}