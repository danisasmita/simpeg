# ============================================================
# Dev subdomain: dev.simpeg.uml.ac.id → port 8001 (simpeg-dev-server stack)
# ============================================================
server {
    listen 80;
    server_name dev.simpeg.uml.ac.id;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://dev.simpeg.uml.ac.id$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name dev.simpeg.uml.ac.id;

    ssl_certificate     /etc/nginx/ssl/live/simpeg.uml.ac.id/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/simpeg.uml.ac.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Opsional: batasi akses hanya untuk tim (uncomment untuk aktifkan)
    # auth_basic "Dev Environment";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    add_header X-Environment "development" always;

    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60;
    }

    error_log  /dev/stderr warn;
    access_log /dev/stdout combined;
}

# ============================================================
# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name simpeg.uml.ac.id www.simpeg.uml.ac.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://simpeg.uml.ac.id$request_uri;
    }
}

# HTTPS main app
server {
    listen 443 ssl;
    http2 on;
    server_name simpeg.uml.ac.id;

    charset utf-8;

    ssl_certificate     /etc/nginx/ssl/live/simpeg.uml.ac.id/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/simpeg.uml.ac.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # Foto pegawai → Backend Go
    location ^~ /uploads/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        access_log off;
    }

    # REST API → Backend Go
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120;
    }

    # Swagger → Backend Go (nonaktif di production via Go config)
    location ^~ /swagger/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Aset SPA (nama file di-hash oleh Vite → cache immutable)
    location /assets/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Health check backend
    location = /health {
        proxy_pass http://app:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Index & fallback SPA → Go (client-side routing)
    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /dev/stderr warn;
    access_log /dev/stdout combined;

    client_max_body_size 50M;
}
